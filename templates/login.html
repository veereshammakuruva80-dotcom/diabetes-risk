{% extends "base.html" %}

{% block title %}Sign In — GlucoGuard AI{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" id="login-card">
        <div class="auth-header">
            <h1>Welcome Back</h1>
            <p>Access your health profile and diabetic risk metrics.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" id="login-form">
            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <div class="form-group">
                <label for="email" class="form-label">Email Address *</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com"
                    value="{{ email or '' }}" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password *</label>
                <div class="password-input-group">
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••"
                        required autocomplete="current-password">
                    <button type="button" class="password-toggle-btn" data-target="password" tabindex="-1">Show</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="btn-submit-login" style="margin-top: 1rem;">
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            <span>Don't have an account yet?</span>
            <a href="{{ url_for('auth.register') }}" id="link-to-register">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
