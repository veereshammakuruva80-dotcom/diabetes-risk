{% extends "base.html" %}

{% block title %}500 — Server Error | GlucoGuard AI{% endblock %}

{% block content %}
<div class="auth-wrapper" style="text-align: center;">
    <div class="auth-card">
        <h1 style="font-size: 3.5rem; color: var(--accent-rose); margin-bottom: 0.5rem;">500</h1>
        <h2 style="font-size: 1.5rem; margin-bottom: 1rem;">Internal Server Error</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">
            An unexpected error occurred while processing your request. Please try again later.
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Home</a>
    </div>
</div>
{% endblock %}
